services:
  inference:
    image: videothinker-serving:local
    build:
      context: .
      dockerfile: Dockerfile.serving
    container_name: videothinker-serving
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 1gb
    environment:
      MODEL_PATH: /model
      VIDEO_DATA_ROOT: /data
      CPU_OFFLOAD_GB: "6"
      GPU_MEMORY_UTILIZATION: "0.8"
      MODEL_STARTUP_TIMEOUT_SECONDS: "600"
      ENGINE_CHECK_INTERVAL_SECONDS: "5"
      ENGINE_CHECK_TIMEOUT_SECONDS: "5"
      ENGINE_CHECK_FAILURE_LIMIT: "3"
      SERVICE_UNRESPONSIVE_TIMEOUT_SECONDS: "60"
    volumes:
      - type: bind
        source: ${VIDEO_MODEL_DIR:-D:/projects/VideoThinker-R1-3B}
        target: /model
        read_only: true
      - type: bind
        source: ${VIDEO_DATA_DIR:-D:/projects/longvideo}
        target: /data
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
